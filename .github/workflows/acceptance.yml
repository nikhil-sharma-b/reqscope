name: Release acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: reqscope-${{ runner.os }}-${{ runner.arch }}
          path: bin/reqscope
